services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: auth-service
    container_name: auth-service
    # Retry startup until ConfigServer is registered/reachable (handles the
    # race when everything is started together with one `docker compose up`).
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFERIPADDRESS=true
      - "SPRING_DATASOURCE_URL=jdbc:mysql://auth-mysql:3306/AuthServiceDatabase?allowPublicKeyRetrieval=true&useSSL=false"
      # Config sets logging.file.name to a C:/ path (used by Jenkins/local);
      # override to a container path written to the 'app-logs' Docker volume.
      - LOGGING_FILE_NAME=/app/logs/AuthService/AuthService-8083.log
    volumes:
      - app-logs:/app/logs
    depends_on:
      auth-mysql:
        condition: service_healthy
    networks:
      - microservices-net

  auth-mysql:
    image: mysql:8.0
    container_name: auth-mysql
    # Not published to the host (your local MySQL already owns host 3306).
    # Reachable by other containers at auth-mysql:3306 on the shared network.
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=AuthServiceDatabase
    volumes:
      - auth-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

volumes:
  auth-mysql-data:
  app-logs:

networks:
  microservices-net:
    external: true
